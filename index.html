<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIMBO Cafe &amp; Restaurant - POS &amp; Caravan Management</title>
    <meta name="description" content="Touch-friendly POS and management system for BIMBO Cafe &amp; Restaurant food caravan featuring dynamic table reordering, takeaway quick checkout, recipe cost &amp; profit calculations, Excel import/export, and monthly archives." />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1817" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BIMBO" />
    <script>
      // Early native PWA prompt capture
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('bimbo:pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('bimbo:pwa-installed'));
      });
    </script>
    <meta property="og:title" content="BIMBO Cafe &amp; Restaurant - POS &amp; Caravan Management" />
    <meta property="og:description" content="Touch-friendly POS and management system for BIMBO Cafe &amp; Restaurant food caravan featuring dynamic table reordering, takeaway quick checkout, recipe cost &amp; profit calculations, Excel import/export, and monthly archives." />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/pwa-512x512.png" />
  </head>
  <body class="bg-[#1a1817] text-stone-100 antialiased selection:bg-amber-500 selection:text-black">
    <div id="root">
      <!-- Mobile & PWA launch splash screen: centered circular BIMBO badge on warm charcoal -->
      <div 
        id="launch-splash" 
        style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #1a1817; z-index: 9999; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px;"
      >
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 320px; width: 100%;">
          <div style="position: relative; width: 160px; height: 160px; max-width: 180px; margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center;">
            <img 
              src="/logo-square.png" 
              alt="BIMBO Cafe & Restaurant"
              style="width: 100%; height: 100%; object-fit: contain; max-width: 180px; margin: 0 auto; border-radius: 9999px; box-shadow: 0 12px 36px rgba(0,0,0,0.5); border: 2px solid rgba(217, 119, 6, 0.4); background-color: #1a1817;"
            />
          </div>
          <h1 style="color: #ffffff; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px 0;">
            BIMBO Cafe &amp; Restaurant
          </h1>
          <p style="color: #d97706; font-size: 13px; font-weight: 600; margin: 0 0 18px 0; letter-spacing: 0.05em; text-transform: uppercase;">
            POS &amp; Caravan Management
          </p>
          <div style="display: flex; align-items: center; gap: 8px; color: #a8a29e; font-size: 12px; font-weight: 500;">
            <div style="width: 8px; height: 8px; border-radius: 50%; background-color: #d97706;"></div>
            <span>Loading...</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
