<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIMBO Cafe &amp; Restaurant - POS &amp; Caravan Management</title>
    <meta name="description" content="Touch-friendly POS and management system for BIMBO Cafe &amp; Restaurant food caravan featuring dynamic table reordering, takeaway quick checkout, recipe cost &amp; profit calculations, Excel import/export, and monthly archives." />
    <link rel="icon" type="image/png" href="./pwa-192x192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#141211" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BIMBO" />
    <script>
      // Early native PWA prompt capture (only on http/https)
      window.deferredPrompt = null;
      if (window.location.protocol.startsWith('http')) {
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.deferredPrompt = e;
          window.dispatchEvent(new CustomEvent('bimbo:pwa-prompt-ready'));
        });
        window.addEventListener('appinstalled', function () {
          window.deferredPrompt = null;
          window.dispatchEvent(new CustomEvent('bimbo:pwa-installed'));
        });
      }
    </script>
    <meta property="og:title" content="BIMBO Cafe &amp; Restaurant - POS &amp; Caravan Management" />
    <meta property="og:description" content="Touch-friendly POS and management system for BIMBO Cafe &amp; Restaurant food caravan featuring dynamic table reordering, takeaway quick checkout, recipe cost &amp; profit calculations, Excel import/export, and monthly archives." />
    <meta property="og:image" content="./pwa-512x512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="./pwa-512x512.png" />
  </head>
